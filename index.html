label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
.msg{max-width:80%;padding:8px 12px;border-radius:16px;margin:6px 0;background:var(--card);border:1px solid var(--ln)}
.msg.me{margin-left:auto;background:var(--p);color:#fff;border-color:var(--p)}.msg small{display:block;opacity:.7;font-size:11px}

.login .logo{width:92px;height:92px;margin:0 auto;border-radius:50%;padding:6px}.login .logo div{width:100%;height:100%;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--p)}

<div class="car">${S.offers.map(o=>`<div class="offer" style="background:linear-gradient(120deg,${o.c1},${o.c2})">${sn(o)}<div class="ot"><span class="tag">${esc(o.tag||t('offer'))}</span><h2>${esc(o.title||t('upTo'))}</h2><button class="btn w s" onclick="go('book')">${t('bookBtn')}</button></div></div>`).join('')}</div></div>
${status()}<div class="sec"><h2>${t('services')}</h2><a style="color:var(--p);font-weight:700" href="#" onclick="go('services');return false">${t('seeAll')}</a></div><div class="sv">${S.services.map(s=>`<button onclick="go('services')"><span>${s.img?`<img src="${s.img}" alt="" style="width:58px;height:58px;border-radius:50%;object-fit:cover">`:ic(s.ic,26)}</span>${esc(s[S.lang])}</button>`).join('')}</div>
<div class="sec"><h2>${t('news')}</h2><a style="color:var(--p);font-weight:700" href="#" onclick="go('news');return false">${t('seeAll')}</a></div>${S.posts.slice(0,2).map(postCard).join('')}
<div class="sec"><h2>${t('gallery')}</h2></div><div class="grid">${S.photos.map(p=>`<div class="img" style="${bg(p)}"></div>`).join('')}</div>
<div class="sec"><h2>${t('hours')}</h2></div>${hours()}${locBox()}<div class="sec"><h2>${t('contact')}</h2></div>${waBox()}`,
services:()=>`<div class="sec"><h2>${t('services')}</h2></div>${svcList()}<button class="btn" onclick="go('book')">${t('bookBtn')}</button>`,
book:()=>{const off=!S.open&&S.blockBk;return `<div class="sec"><h2>${t('bookBtn')}</h2></div>${status().replace('margin-top:16px','')}${off?`<div class="card">${t('bkOff')}</div>`:`<div class="card"><label style="margin-top:0">${t('name')}</label><input id="bn" value="${esc(S.user)}"><label>${t('phone')}</label><input id="bp" type="tel"><label>${t('service')}</label><select id="bs">${S.services.map(s=>`<option>${esc(s[S.lang])}</option>`).join('')}</select><label>${t('date')}</label><input id="bd" type="date"><label>${t('time')}</label><input id="bt" type="time" value="15:00"><label>${t('note')}</label><textarea id="bm" rows="2"></textarea><p><button class="btn" onclick="book()">${t('send')}</button></p></div>`}`},
news:()=>`<div class="sec"><h2>${t('news')}</h2></div>${S.posts.map(postCard).join('')}`,
chat:()=>`<div class="sec"><h2>${t('msgs')}</h2></div>${S.chat.map(m=>`<div class="msg ${m.me==!S.owner?'me':''}">${esc(m.x)}<small>${m.h}</small></div>`).join('')}<div class="row" style="margin-top:12px"><input id="cm" placeholder="${t('write')}"><button class="btn s" onclick="sendMsg(!S.owner)">${t('sendMsg')}</button></div>`,
profile:()=>`<div class="sec"><h2>${esc(S.user)} ${S.owner?`<span class="pill">${t('owner')}</span>`:''}</h2></div><div class="card"><label style="margin-top:0">🌐 ${t('lang')}</label>${langSel()}</div><div class="sec"><h2>${t('myBk')}</h2></div>${S.bookings.length?S.bookings.map(b=>`<div class="card"><div class="row"><b>${esc(b.s)}</b><span class="pill">${t(b.st)}</span></div>${esc(b.d)} ${esc(b.h)}</div>`).join(''):`<div class="card">${t('noBk')}</div>`}<div class="btns"><button class="btn o" onclick="go('chat')">${t('msgs')}</button><button class="btn o" onclick="logout()">${t('logout')}</button></div><p style="color:var(--mut);font-size:13px">${t('demo')}</p>`,
admin:()=>{const lk=S.posts.reduce((a,p)=>a+p.likes+(S.liked.has(p.id)?1:0),0);return `<div class="sec"><h2>${t('ownerHi')}</h2></div><div class="card admin"><div class="row"><b>🔔 ${t('notif')}</b>${S.notifs.some(x=>!x.r)?`<span class="badge">${S.notifs.filter(x=>!x.r).length}</span>`:''}</div>${S.notifs.slice(0,8).map(n=>`<div style="margin-top:6px;${n.r?'opacity:.55':'font-weight:700'}">${esc(n.u)} ${t({msg:'nMsg',book:'nBook',like:'nLike'}[n.k])} <small>${n.h}</small></div>`).join('')}${S.notifs.some(x=>!x.r)?`<p><button class="btn o s" onclick="readAll()">${t('markRead')}</button></p>`:''}</div>
<div class="card admin"><b>${t('stats')}</b><div class="grid" style="margin-top:8px;font-weight:700"><div>${ic('cal',18)} ${S.bookings.length}</div><div>${ic('chat',18)} ${S.chat.length}</div><div>${ic('star',18)} ${S.posts.length}</div><div>${ic('heart',18)} ${lk}</div></div></div>
<div class="card admin"><div class="btns"><button class="btn s" style="background:var(--ok)" onclick="setOpen(true)">🟢 ${t('openBtn')}</button><button class="btn s" style="background:var(--red)" onclick="setOpen(false)">🔴 ${t('closeBtn')}</button></div><label><input type="checkbox" style="width:auto" ${S.blockBk?'checked':''} onchange="S.blockBk=this.checked"> ${t('blockBk')}</label></div>
<div class="card admin"><label style="margin-top:0">${t('bizName')}</label><div class="row"><input id="an" value="${esc(S.name)}"><button class="btn s" onclick="S.name=$('an').value;toast(t('saved'))">${t('save')}</button></div><label>${t('waEdit')}</label><div class="row"><input id="aw" value="${esc(S.wa)}"><button class="btn s" onclick="S.wa=$('aw').value;toast(t('saved'))">${t('save')}</button></div></div>
<div class="card admin"><label style="margin-top:0">${t('newPost')}</label><textarea id="ap" rows="2" placeholder="${t('postPh')}"></textarea><input type="file" accept="image/*" style="margin-top:6px" onchange="S.pendImg=this.files[0]?URL.createObjectURL(this.files[0]):''"><p style="margin:8px 0 0"><button class="btn s" onclick="pub()">${t('publish')}</button></p></div>
<div class="card admin"><b>${t('logoT')}</b><div class="row" style="justify-content:flex-start;margin:8px 0">${logoEl(56)}</div><input type="file" accept="image/*" onchange="setLogo(this.files[0])"></div>
<div class="card admin"><b>${t('loc')}</b><label>${t('addr')}</label><input value="${esc(S.addr)}" onchange="S.addr=this.value;toast(t('saved'))"><div class="row" style="margin-top:8px"><input value="${esc(S.lat)}" placeholder="${t('lat')}" inputmode="decimal" onchange="S.lat=this.value.trim();toast(t('saved'))"><input value="${esc(S.lng)}" placeholder="${t('lng')}" inputmode="decimal" onchange="S.lng=this.value.trim();toast(t('saved'))"></div><p><button class="btn s" onclick="useGps()">${ic('pin',16)} ${t('useGps')}</button></p></div>
<div class="card admin"><b>${t('galMgr')}</b><div class="grid" style="margin:8px 0">${S.photos.map(p=>`<div class="thumb"><div class="img" style="${bg(p)}"></div><button class="x" aria-label="${t('del')}" onclick="delPhoto(${p.id})">✕</button></div>`).join('')}</div><label>${t('addPhoto')}</label><input type="file" accept="image/*" onchange="addPhoto(this.files[0])"></div>
<div class="card admin"><b>${t('svcMgr')}</b>${S.services.map((s,i)=>`<div style="border-top:1px solid var(--ln);margin-top:10px;padding-top:8px"><div class="row"><input value="${esc(s.es)}" aria-label="${t('nES')}" onchange="S.services[${i}].es=this.value"><input value="${esc(s.fr)}" aria-label="${t('nFR')}" onchange="S.services[${i}].fr=this.value"></div><div class="row" style="margin-top:6px"><input type="number" min="0" value="${s.p}" aria-label="${t('price')}" onchange="S.services[${i}].p=+this.value;render()"><button class="btn o s" onclick="delSvc(${i})">${t('del')}</button></div><input type="file" accept="image/*" style="margin-top:6px" onchange="svcImg(${i},this.files[0])"></div>`).join('')}<p><button class="btn s" onclick="addSvc()">+ ${t('addSvc')}</button></p></div>
<div class="card admin"><b>${t('banners')}</b>${S.offers.map((o,i)=>`<div style="border-top:1px solid var(--ln);margin-top:10px;padding-top:8px"><select onchange="S.offers[${i}].style=this.value;render()">${['scissors','pole','rings'].map(k=>`<option value="${k}" ${o.style==k?'selected':''}>${k}</option>`).join('')}</select><div class="row" style="margin-top:6px"><input value="${esc(o.tag)}" placeholder="${t('tagT')}" onchange="S.offers[${i}].tag=this.value;render()"><input value="${esc(o.title)}" placeholder="${t('titleT')}" onchange="S.offers[${i}].title=this.value;render()"></div><div class="row" style="margin-top:6px"><input type="color" value="${o.c1}" aria-label="${t('c1')}" onchange="S.offers[${i}].c1=this.value;render()"><input type="color" value="${o.c2}" aria-label="${t('c2')}" onchange="S.offers[${i}].c2=this.value;render()"><input type="number" step="0.2" min="0.4" max="6" value="${o.speed}" aria-label="${t('speed')}" onchange="S.offers[${i}].speed=+this.value;render()"></div><input type="file" accept="video/*" style="margin-top:6px" aria-label="${t('vid')}" onchange="banVid(${i},this.files[0])"><p><button class="btn o s" onclick="delBan(${i})">${t('del')}</button></p></div>`).join('')}<p><button class="btn s" onclick="addBan()">+ ${t('addBan')}</button></p></div>
<div class="card admin"><b>${t('postsMgr')}</b>${S.posts.map(p=>`<div class="row" style="margin-top:8px"><span>${esc(p.t||'📸')}</span><button class="btn o s" onclick="delPost(${p.id})">${t('del')}</button></div>`).join('')}</div>
<div class="card admin"><b>${t('requests')}</b>${S.bookings.map((b,i)=>`<div style="margin-top:8px">${esc(b.n)} · ${esc(b.s)} · ${esc(b.d)} ${esc(b.h)} <span class="pill">${t(b.st)}</span>${b.st=='pending'?`<div class="btns" style="margin-top:6px"><button class="btn s" onclick="setBk(${i},'confirmed')">${t('confirm')}</button><button class="btn o s" onclick="setBk(${i},'rejected')">${t('reject')}</button></div>`:''}</div>`).join('')}</div>
<div class="card admin"><b>${t('reply')}</b><div class="row" style="margin-top:8px"><input id="cm"><button class="btn s" onclick="sendMsg(false)">${t('sendMsg')}</button></div></div>`}};
function render(){const a=$('app');if(!S.user){a.innerHTML=`<div class="login view"><div class="logo stripes"><div style="overflow:hidden">${S.logo?`<img class="lg" src="${S.logo}" alt="" style="width:100%;height:100%">`:ic('scissors',40)}</div></div><h1>${esc(S.name)}</h1><p style="color:var(--mut);margin:0">${t('loginP')}</p><input id="ln" placeholder="${t('name')}" autocomplete="off" onkeydown="if(event.key=='Enter')login()"><button class="btn" onclick="login()">${t('enter')}</button><div>${langSel()}</div></div>`;return}
const nav=S.owner?[['home','home',t('home')],['admin','shield',t('admin')],['news','heart',t('news')],['chat','chat',t('msgs')],['profile','user',t('profile')]]:[['home','home',t('home')],['services','scissors',t('services')],['book','cal',t('book')],['news','heart',t('news')],['profile','user',t('profile')]];
a.innerHTML=`<div class="view" ${S.view=='home'?'':'style="padding-top:8px"'}>${V[S.view]()}</div>${S.toast?`<div class="toast">${esc(S.toast)}</div>`:''}<nav><div>${nav.map(n=>`<button class="${S.view==n[0]?'on':''}" onclick="go('${n[0]}')">${ic(n[1],24)}${n[2]}${n[0]=='admin'&&S.notifs.some(x=>!x.r)?`<span class="badge" style="position:absolute;top:4px;right:22%">${S.notifs.filter(x=>!x.r).length}</span>`:''}</button>`).join('')}</div></nav>`}
function login(){const v=$('ln').value.trim();if(!v)return;S.user=v;S.owner=v.toLowerCase()===OWNER;store('user',v);S.view=S.owner?'admin':'home';render()}
function logout(){S.user='';S.owner=false;store('user','');S.view='home';render()}
function like(id){if(S.liked.has(id))S.liked.delete(id);else{S.liked.add(id);if(!S.owner)S.notifs.unshift({k:'like',u:S.user,h:hm(),r:0})}render()}
function copyWa(){try{navigator.clipboard.writeText(S.wa)}catch(e){}toast(t('copied'))}
function setLang(l){S.lang=l;store('lang',l);document.documentElement.lang=l;render()}
function readAll(){S.notifs.forEach(n=>n.r=1);render()}
function setLogo(f){if(!f)return;const r=new FileReader();r.onload=()=>{S.logo=r.result;store('logo',r.result);toast(t('saved'))};r.readAsDataURL(f)}
function useGps(){try{navigator.geolocation.getCurrentPosition(p=>{S.lat=p.coords.latitude.toFixed(6);S.lng=p.coords.longitude.toFixed(6);toast(t('saved'))},()=>toast(t('noGps')))}catch(e){toast(t('noGps'))}}
function setOpen(o){S.open=o;render()}
function pub(){const v=$('ap').value.trim();if(!v&&!S.pendImg)return;S.posts.unshift({id:Date.now(),t:v,n:true,likes:0,c:'#7B3FE4',src:S.pendImg||''});S.pendImg='';toast(t('saved'))}
function addPhoto(f){if(!f)return;const u=URL.createObjectURL(f);S.photos.unshift({id:Date.now(),src:u});S.posts.unshift({id:Date.now()+1,t:'',n:true,likes:0,src:u});toast(t('saved'))}
function delPhoto(id){S.photos=S.photos.filter(p=>p.id!=id);render()}
function svcImg(i,f){if(!f)return;S.services[i].img=URL.createObjectURL(f);render()}
function addSvc(){S.services.push({es:'Nuevo servicio',fr:'Nouveau service',p:100,ic:'scissors'});render()}
function delSvc(i){S.services.splice(i,1);render()}
function banVid(i,f){if(!f)return;S.offers[i].video=URL.createObjectURL(f);render()}
function addBan(){S.offers.push({style:'pole',tag:'',title:'',c1:'#1b1233',c2:'#7B3FE4',speed:2,video:''});render()}
function delBan(i){S.offers.splice(i,1);render()}
function delPost(id){S.posts=S.posts.filter(p=>p.id!=id);render()}
function setBk(i,s){S.bookings[i].st=s;render()}
const hm=()=>new Date().toTimeString().slice(0,5);
function book(){const g=i=>$(i).value.trim();if(!g('bn')||!g('bp')||!g('bd'))return;S.bookings.unshift({n:g('bn'),s:g('bs'),d:g('bd'),h:g('bt'),st:'pending'});S.notifs.unshift({k:'book',u:S.user,h:hm(),r:0});S.view='profile';toast(t('sent'))}
function sendMsg(me){const v=$('cm').value.trim();if(!v)return;S.chat.push({x:v,me:me,h:hm(),by:S.user});if(me&&!S.owner)S.notifs.unshift({k:'msg',u:S.user,h:hm(),r:0});render()}
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
